# Codemagic CI for Aus Phone Towers (iOS & Web) — Flutter app.
#
# Recreated 2026-08-21 from the "Default Workflow" configured in Codemagic's
# workflow-editor UI (app 61db713b344ed87cc8f87b61), so the pipeline is
# versioned in the repo instead of living only in the dashboard. The app has
# since been switched to this file: the November 2026 builds ran its step names
# and its pinned Flutter version.
#
# Secrets stay in Codemagic, never in this file:
#   - Android keystore: team reference "android_flutter" (alias "bitbot") —
#     the app's original Play upload key, recovered from Google Drive backup
#     on 2026-08-22 and uploaded to Code signing identities.
#   - iOS: the "Codemagic Nuptial Flight" App Store Connect API key
#     (75423D3XRN) already exists as a team integration; signing files are
#     fetched automatically via the ios_signing block below.
#   - google_credentials env group defines GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
#     (same group the Java app's codemagic.yaml uses).
#   - aws_credentials env group defines AWS_ACCESS_KEY_ID and
#     AWS_SECRET_ACCESS_KEY (the workflow editor's S3 publishing credentials).
#
# One editor feature has no YAML equivalent: "Codemagic Static Pages"
# (ausphonetowers.codemagic.app). The production site is the S3 bucket deploy
# below; if the codemagic.app mirror is still wanted, keep publishing one build
# from the workflow editor or drop the mirror.

workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m4
    max_build_duration: 60
    environment:
      android_signing:
        - android_flutter
      ios_signing:
        distribution_type: app_store
        bundle_identifier: au.com.bitbot.phonetowers
      groups:
        - google_credentials # GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        - aws_credentials # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
      vars:
        AWS_DEFAULT_REGION: ap-southeast-2
        AWS_S3_BUCKET: ausphonetowers.com.au
      # Pinned to an exact version, never `stable`: when stable moved to 3.50.0 on 2026-11-11 it
      # refused this project's AGP and Kotlin versions, and builds 165 and 166 failed before
      # producing anything (1.16.4 shipped on 3.47.9). The Android toolchain in android/ matches
      # this version's app template (AGENTS.md "Android toolchain"). To raise it, read the new
      # version's DependencyVersionChecker.kt and gradle_utils.dart and move android/ to match.
      flutter: 3.50.0
      # Gradle must run on Java 21, not Codemagic's default 17: AGP 9.3's lint calls
      # List.removeLast(), which Java 17 lacks, and build 168 failed in lintVitalAnalyzeRelease
      # with NoSuchMethodError. The bundle step points Flutter at this JDK.
      java: 21
      # Deliberately not pinned (bead aptios-84p): App Store Connect only accepts builds from
      # recent Xcode SDKs, and Codemagic moves `latest` to a new major Xcode only on a date it
      # announces in its GitHub Discussions (minor and patch releases move at once). The build
      # log's machine-preparation step names the Xcode each build used. Pin a version here
      # (e.g. `xcode: 27.2`) if a new Xcode ever breaks the build, and unpin once fixed.
      xcode: latest
      # Codemagic's default for the image (1.16.2 on the Xcode 26.6 image, 1.17.0 on 27.x). Pin
      # it to the version on the last line of the committed ios/Podfile.lock once there is one.
      cocoapods: default
    integrations:
      app_store_connect: Codemagic Nuptial Flight
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.gradle/caches
        - $FLUTTER_ROOT/.pub-cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: dev
          include: true
          source: true
    # Only run the full build when the version is bumped, mirroring the Java app's guard on
    # app/build.gradle. Without this, EVERY push to main built and published: the S3 script below
    # syncs to ausphonetowers.com.au with --cache-control no-cache, so an ordinary merge went
    # live on the website immediately, and the App Store Connect step re-uploaded an already-used
    # build number and failed. Landed 2026-08-24 after exactly that happened (iphone#52).
    #
    # Blast radius (AGENTS.md requires this to be stated for codemagic.yaml changes):
    #   * A merge to main that does not touch pubspec.yaml no longer builds, publishes to
    #     TestFlight, or deploys the web app. Shipping now REQUIRES a version bump - if a change
    #     seems not to have reached the site, check that pubspec.yaml was part of the same push.
    #   * Applies to the dev branch too, since `when` is workflow-wide.
    #   * The version line is the only gate; editing pubspec.yaml for any other reason (a
    #     dependency change, say) will also trigger a build.
    when:
      changeset:
        includes:
          - 'pubspec.yaml'
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      # The workflow editor ran `flutter test` with "Stop build if tests fail"
      # — a failing test aborts the build here the same way.
      - name: Flutter unit and widget tests
        script: flutter test
      # android/app/build.gradle signs from android/key.properties (gitignored),
      # so generate it from the env vars Codemagic's android_signing injects.
      - name: Set up Android release signing
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build Android App Bundle (release)
        script: |
          # Flutter prefers its own config, then Android Studio's JDK, then JAVA_HOME; pin it to
          # the Java 21 that `java: 21` puts in JAVA_HOME so Gradle cannot fall back to 17.
          flutter config --jdk-dir="$JAVA_HOME"
          java -version
          flutter build appbundle --release
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA (release)
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
      - name: Build web (release)
        script: flutter build web --release
      # The workflow editor's "AWS S3 Bucket" publishing step: this bucket IS
      # https://ausphonetowers.com.au, so a green build deploys the website.
      #
      # Cache headers are load-bearing: the site sits behind Cloudflare, and when S3 sends no
      # Cache-Control, Cloudflare edge-caches .js by its default TTL — after the 1.13.12
      # deploy, edges kept serving the OLD main.dart.js. Every file is uploaded with no-cache;
      # see the inline notes below for why nothing is cached for longer.
      - name: Publish web app to S3 (ausphonetowers.com.au)
        script: |
          set -e
          # Everything with Cache-Control: no-cache, i.e. "revalidate", not "do not store": an
          # unchanged file costs the browser a 304 by ETag, a changed one is fetched at once.
          #
          # Nothing in build/web is content-hashed: main.dart.js, assets/* (the path-loss table,
          # map style, pin icons, the tree-shaken MaterialIcons font, AssetManifest) and the icons
          # all keep their names from build to build. Until 1.16.6 this step uploaded them
          # "immutable" for a year on the belief that Flutter hashed the assets, and since Flutter
          # 3.50 its service worker only unregisters itself, so nothing re-fetched them either: a
          # returning visitor could run a new main.dart.js against last year's path-loss table or
          # icon font (bead aptios-rk2). One policy for every file keeps a load consistent.
          #
          # canvaskit/ is not exempt: the engine loads CanvasKit from www.gstatic.com by engine
          # revision, so these copies are normally never requested, and they are not versioned
          # either.
          #
          # Cloudflare, measured 2026-11-14 after a purge: the edge revalidates every file with S3
          # (cf-cache-status REVALIDATED), so it does not serve old copies. Browsers get no-cache
          # for .html, .js and .json (the zone's "Flutter entry files" Cache Rule passes it
          # through), but max-age=14400 for images and fonts, where the zone's 4 h Browser Cache
          # TTL overrides the origin. So a browser can keep a pin icon or the icon font for up to
          # 4 hours after a release (bead aptios-pkv). Until 2026-11-14 this comment said
          # Cloudflare passed no-cache through for every file; that holds only for those types.
          #
          # cp --recursive, not sync, so every object is rewritten with this header even when
          # sync would skip it as unchanged (a file copied out of the Flutter SDK can keep an old
          # mtime). The sync after it only deletes objects the new build no longer has.
          aws s3 cp build/web "s3://$AWS_S3_BUCKET" --recursive --cache-control "no-cache"
          aws s3 sync build/web "s3://$AWS_S3_BUCKET" --delete --cache-control "no-cache"
      # Old objects cached at Cloudflare edges persist until their TTL even after the
      # headers change, so purge on deploy. No-ops until CLOUDFLARE_ZONE_ID and
      # CLOUDFLARE_API_TOKEN (a token with Zone.Cache Purge permission) are added to the
      # Codemagic environment group. Since 1.16.6 every file goes out no-cache and the edge
      # revalidates it with S3, so this purge is a backstop, not needed for a correct deploy.
      - name: Purge Cloudflare cache (skipped until credentials configured)
        script: |
          if [ -n "${CLOUDFLARE_ZONE_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          else
            echo "Cloudflare purge skipped: CLOUDFLARE_ZONE_ID / CLOUDFLARE_API_TOKEN not set"
          fi
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/ios/ipa/*.ipa
      # The CocoaPods lock this build resolved (native Google Maps, Ads and Firebase versions,
      # and the CocoaPods version on its last line). Download it from the build to commit it;
      # see AGENTS.md "Reproducible builds" (bead aptios-84p).
      - ios/Podfile.lock
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - brushworth@bitbot.com.au
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Store-listing screenshots, captured on an iOS simulator.
  #
  # Deliberately has NO `triggering:` block, so it never runs on push and cannot slow or break a
  # release — start it by hand from the Codemagic UI when the listing needs refreshing. It exists
  # because App Store screenshots otherwise have to be taken by hand on a physical iPhone, which
  # is impossible from a Windows machine and was leaving the listing several releases stale.
  #
  # It also avoids the privacy trap of hand-taken screenshots: the run is scripted, so it never
  # centres on whoever happened to be holding the phone.
  screenshots-workflow:
    name: Store Screenshots (iOS simulator)
    instance_type: mac_mini_m4
    max_build_duration: 30
    environment:
      # Pinned to an exact version, never `stable`: when stable moved to 3.50.0 on 2026-11-11 it
      # refused this project's AGP and Kotlin versions, and builds 165 and 166 failed before
      # producing anything (1.16.4 shipped on 3.47.9). The Android toolchain in android/ matches
      # this version's app template (AGENTS.md "Android toolchain"). To raise it, read the new
      # version's DependencyVersionChecker.kt and gradle_utils.dart and move android/ to match.
      flutter: 3.50.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Boot an iPhone simulator
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          # Pick by SIZE CLASS, never by position in the list and never by model name.
          #
          # This used to take the LAST iPhone simctl reported, on the assumption that the list
          # is ordered newest-last. It is not ordered by screen size at all, so a run could land
          # on a 6.1"/6.3" device and produce perfectly good screenshots at a resolution the App
          # Store rejects - with the build still green, because nothing downstream ever looked
          # at the pixels. The Stickybeak workflow hit the same trap from the other direction:
          # it named a model ("iPhone 16 Pro Max"), missed once Xcode shipped the 17 family,
          # fell through to the first iPhone in the list and captured a 6.3" at 1206x2622.
          #
          # Capture on the largest iPhone available and resize afterwards. THIS LISTING'S largest
          # iPhone slot is the 6.5" class (1284x2778) - its Media Manager offers 6.5, 6.3, 6.1,
          # 5.5 and 4.7 and has no 6.9" slot at all - and simulators for the 6.5" class (iPhone
          # XS Max, 11 Pro Max) are long gone from current Xcode images, so there is nothing to
          # pick that captures at the target size natively. The "Normalise" step below does it.
          PICK=""
          for WANT in "Pro Max" "Plus" "iPhone"; do
            PICK=$(xcrun simctl list devices available | grep -E "^ +iPhone" | grep "$WANT" | tail -1 || true)
            [ -n "$PICK" ] && break
          done
          [ -n "$PICK" ] || { echo "No iPhone simulator available"; exit 1; }
          UDID=$(echo "$PICK" | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          NAME=$(echo "$PICK" | sed "s/ (.*//" | sed "s/^ *//")
          [ -n "$UDID" ] || { echo "Could not parse a simulator UDID from: $PICK"; exit 1; }
          echo "Using simulator: $NAME ($UDID)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> $CM_ENV
      - name: Capture screenshots
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          # SCREENSHOT_MODE stops main() awaiting the App Tracking Transparency prompt. That
          # prompt is a SYSTEM modal whose future never completes unless a human taps it, so on
          # this simulator it deadlocked startup before runApp() and the app rendered nothing at
          # all - no crash, no exception, just an app that never started. The screenshot test
          # now asserts a MaterialApp actually painted, which is what turned that from a silent
          # placeholder screenshot into a build failure.
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshot_test.dart \
            --dart-define=SCREENSHOT_MODE=true \
            -d "$SIM_UDID"
          ls -la screenshots/
      - name: Normalise the screenshots to the 6.5 inch slot
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          # Resize every capture to 1284x2778, the largest iPhone size THIS listing accepts.
          # Nothing here used to touch the pixels, so the pipeline produced 6.9" images and the
          # step below happily approved them - for a Media Manager with no 6.9" slot to put them
          # in. Aimed at the wrong number, the check was worse than no check: it read as proof.
          #
          # Scale to COVER the target, then centre-crop. 1320x2868 and 1284x2778 differ in aspect
          # by about 0.4%, so this trims roughly eleven pixels off the height and nothing that
          # carries meaning. Scaling by the dimension that leaves the other oversized is what
          # keeps the crop a crop: resample by width alone and a shorter source (a 4.7" fallback,
          # say) would come out under 2778 tall, and sips would pad it with background rather
          # than fail. Landscape captures are left alone; this listing is portrait.
          shopt -s nullglob
          for F in screenshots/*.png; do
            W=$(sips -g pixelWidth "$F" | awk "/pixelWidth/{print \$2}")
            H=$(sips -g pixelHeight "$F" | awk "/pixelHeight/{print \$2}")
            if [ "$W" -ge "$H" ]; then
              echo "  ${W}x${H}  $F  left alone (landscape)"
              continue
            fi
            if [ "$W" = "1284" ] && [ "$H" = "2778" ]; then
              echo "  ${W}x${H}  $F  already 6.5 inch"
              continue
            fi
            # Relatively wider than 1284:2778 -> its height is the binding dimension, and vice
            # versa. Integer cross-multiplication, so no floating point in the shell.
            if [ $((W * 2778)) -gt $((H * 1284)) ]; then
              sips --resampleHeight 2778 "$F" > /dev/null
            else
              sips --resampleWidth 1284 "$F" > /dev/null
            fi
            sips -c 2778 1284 "$F" > /dev/null
            echo "  ${W}x${H} -> 1284x2778  $F"
          done
      - name: Verify the screenshots are a size the App Store accepts
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          # Pixel dimensions are what actually gate an upload, and until this step existed
          # nothing in the pipeline ever looked at them. A run that captures the right content
          # at the wrong size reads exactly like a good one in the build log.
          shopt -s nullglob
          FILES=(screenshots/*.png)
          [ ${#FILES[@]} -gt 0 ] || { echo "no screenshots produced"; exit 1; }
          BAD=0
          for F in "${FILES[@]}"; do
            W=$(sips -g pixelWidth "$F" | awk "/pixelWidth/{print \$2}")
            H=$(sips -g pixelHeight "$F" | awk "/pixelHeight/{print \$2}")
            case "${W}x${H}" in
              1284x2778|2778x1284|1242x2688|2688x1242) NOTE="ok (6.5 inch)" ;;
              *) NOTE="REJECTED - not a 6.5 inch App Store size"; BAD=1 ;;
            esac
            echo "  ${W}x${H}  $F  $NOTE"
          done
          # Fail loudly. Having App Store Connect refuse these by hand later is a much worse
          # place to find out than here.
          [ "$BAD" -eq 0 ] || { echo "One or more screenshots are the wrong size."; exit 1; }
    artifacts:
      - screenshots/*.png
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - brushworth@bitbot.com.au
        notify:
          success: true
          failure: true
