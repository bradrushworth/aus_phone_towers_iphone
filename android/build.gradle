// Toolchain versions live in settings.gradle (AGP and Kotlin plugins) and
// gradle/wrapper/gradle-wrapper.properties (Gradle). They match the template of the Flutter
// version codemagic.yaml pins; see AGENTS.md "Android toolchain" before changing them.
allprojects {
    ext {
        compileSdkVersion = 37
        minSdkVersion = 24
        targetSdkVersion = 36
    }

    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir('../../build').get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
