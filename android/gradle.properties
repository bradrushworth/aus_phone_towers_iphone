org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# AGP 9 opt-outs, the same two lines Flutter 3.50's own app template writes.
# builtInKotlin stays false because in_app_review (2.0.12, the latest) still applies the Kotlin
# Gradle plugin itself, which AGP 9 rejects once built-in Kotlin is on (upstream
# britannio/in_app_review#190). Every other plugin here already handles both settings.
# newDsl stays false until Flutter's template turns it on. See AGENTS.md "Android toolchain".
android.builtInKotlin=false
android.newDsl=false
#android.enableR8=true
