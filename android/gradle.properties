org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# AGP built-in Kotlin compiles every module's Kotlin; nothing here applies the Kotlin Gradle
# plugin any more. Flutter 3.50's own template still writes false; this app turned it on with
# in_app_review vendored under packages/in_app_review (upstream still applies KGP, see
# packages/in_app_review/VENDORED.md). newDsl stays false until Flutter's template turns it on.
# See AGENTS.md "Android toolchain".
android.builtInKotlin=true
android.newDsl=false
#android.enableR8=true
